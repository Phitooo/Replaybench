<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1330" viewBox="0 0 700 1330" role="img" aria-labelledby="t d"><title id="t">TRAP: tool-result misbinding</title><desc id="d">A genuine order result from task A is replayed unchanged into task B, causing the agent to cancel the wrong order.</desc>
