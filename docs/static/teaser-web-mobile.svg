<text x="36" y="117" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#193342" text-anchor="start">Real result.</text>
<text x="36" y="172" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#193342" text-anchor="start">Wrong context.</text>
<text x="37" y="212" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#526b78" text-anchor="start">An unchanged order response crosses tasks.</text>
