<text x="510" y="520" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<rect x="85" y="527" width="530" height="101" rx="10" fill="#fce9e5" stroke="#c84f4b" stroke-width="2"/>
