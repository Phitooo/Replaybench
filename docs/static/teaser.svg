<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">TRAP: tool-result misbinding</title><desc id="d">A genuine order result from task A is replayed unchanged into task B, causing the agent to cancel the wrong order.</desc>
