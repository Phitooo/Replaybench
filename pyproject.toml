[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replaybench"
version = "0.1.0"
description = "Cross-task genuine tool-result replay benchmark (not prompt injection)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "ReplayBench Authors"}]
dependencies = []

[project.optional-dependencies]
llamaindex = [
  "llama-index>=0.10",
  "llama-index-llms-openai",
  "llama-index-agent-openai",
]
dev = ["pytest>=8"]

[project.scripts]
replaybench = "replaybench.cli:main"

[tool.setuptools.packages.find]
include = ["replaybench*"]

[tool.setuptools.package-data]
replaybench = ["cases/**/*.json", "cases/**/*.txt", "data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
